name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **No real data here.** Do not paste or attach a snapshot (`.ionx`), a token, logs, IP addresses, names or screenshots of a real contract: issues are public. Show the problem with the demo contract (`fixtures/demo-contract.ionx`, or the fake API in `deploy/`), or describe it in made-up terms. A security problem: SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`ionos-explorer --version`, the image tag, or the commit."
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How it runs
      options:
        - ionos-explorer on my machine (local mode)
        - Hosted, container (Docker / Compose / Swarm)
        - Hosted, Kubernetes
        - Hosted, other
        - ionos-export and the explorer separately
        - The explorer from a static host
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce it, best with the demo contract.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Browser, operating system, proxy in front. Check any log lines for data before you paste them.
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: This issue contains no real snapshot, token, log or screenshot of a real contract.
          required: true
