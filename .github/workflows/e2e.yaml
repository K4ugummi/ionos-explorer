# Browser checks of the deployment files with the fake IONOS API (synthetic
# data, no IONOS account): Docker Compose and Kubernetes (kind). Each sets up
# the first admin, fetches, logs out, restarts the explorer and logs in
# again. On failure the screenshots and logs are uploaded.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - e2e/**
      - exporter/**
      - explorer/**
      - .github/workflows/e2e.yaml
  schedule:
    - cron: "17 4 * * 1" # Mondays: new base images and dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        target: [compose, kind]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.target == 'kind'
        with:
          go-version-file: exporter/go.mod
          cache-dependency-path: exporter/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright with Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: e2e/${{ matrix.target }}.sh
        run: e2e/"$TARGET".sh
        env:
          TARGET: ${{ matrix.target }}
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.target }}
          path: e2e/results/
          retention-days: 7
