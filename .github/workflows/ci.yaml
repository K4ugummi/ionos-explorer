# Every push and pull request: tests, vulnerability and secret scans, the
# deployment files, and the container image (built for amd64 and arm64, not
# pushed; amd64 smoke-tested). The steps call Makefile targets and scripts/,
# so each runs the same locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: exporter/go.mod
          cache-dependency-path: exporter/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: explorer
      - name: Go vet and tests, UI lint, tests and build
        run: make test
      - name: Go tests with the race detector
        run: make test-race
      - name: Known vulnerabilities (govulncheck, npm audit)
        run: make vuln

  repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: exporter/go.mod
          cache-dependency-path: exporter/go.sum
      - name: No snapshots or credential files tracked
        run: scripts/check-repo.sh
      - name: No secrets in the history (gitleaks)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS" \
            git /repo --redact --verbose --no-banner
        env:
          GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Workflows (actionlint)
        run: make lint-actions

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: exporter/go.mod
          cache-dependency-path: exporter/go.sum
      - name: Kustomize renders (kubeconform), Compose files, Swarm stack
        run: scripts/check-deploy.sh

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nothing but source in the build context
        run: scripts/check-context.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          load: true
          tags: ionos-explorer:ci
      - name: Smoke test (hardened run, probes, users, health, stop, random UID)
        run: scripts/smoke-image.sh ionos-explorer:ci
