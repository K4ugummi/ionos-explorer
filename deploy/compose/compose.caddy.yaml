# Adds Caddy in front: TLS with an automatic certificate (Let's Encrypt or
# ZeroSSL) for DOMAIN, forwarding to the explorer with the original Host.
#
#   DOMAIN=explorer.example.com and PUBLIC_URL=https://explorer.example.com in .env
#   docker compose -f compose.yaml -f compose.caddy.yaml up -d
#
# DOMAIN must resolve to this server, with ports 80 and 443 reachable.
services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:?set DOMAIN in .env}", "--to", "explorer:8080"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data            # certificates and keys
      - caddy-config:/config
    depends_on: [explorer]

volumes:
  caddy-data: {}
  caddy-config: {}
