# The snapshot history: every fetch kept per user on the volume, encrypted
# to the age identity in the Secret ionos-explorer-age (key age_identity;
# make one with: docker run --rm ghcr.io/k4ugummi/ionos-explorer keygen).
# Keep a copy of the identity elsewhere: without it the history cannot be
# read. The overlay creates the Secret, for example with a secretGenerator
# (see overlays/example/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: ionos-explorer
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: age
          secret:
            secretName: ionos-explorer-age
            defaultMode: 0440
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: age
          mountPath: /keys
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IONOS_EXPLORER_AGE_IDENTITY_FILE
          value: /keys/age_identity
