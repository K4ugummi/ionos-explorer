apiVersion: apps/v1
kind: Deployment
metadata:
  name: ionos-explorer
spec:
  # Exactly one: sessions and held tokens live in its memory, and the
  # volume is ReadWriteOnce. Recreate: the old pod is gone before the new
  # one starts (a restart logs everyone out).
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      # No IONOS_EXPLORER_PORT_* variables from the Service of the same name.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: explorer
          image: ghcr.io/k4ugummi/ionos-explorer:latest   # overlays set the version (images:)
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ionos-explorer
          env: []   # the components add to it
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ionos-explorer-data
